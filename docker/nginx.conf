events {}

http {
    upstream user_service {
        server ai-review-user-service:8080;
    }

    upstream shop_service {
        server ai-review-shop-service:8080;
    }

    upstream review_service {
        server ai-review-review-service:8080;
    }

    upstream order_service {
        server ai-review-order-service:8080;
    }

    server {
        listen 80;

        location /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location /ping {
            proxy_pass http://user_service;
        }

        location /register {
            proxy_pass http://user_service;
        }

        location /login {
            proxy_pass http://user_service;
        }

        location /user/ {
            proxy_pass http://user_service;
        }

        location /shops {
            proxy_pass http://shop_service;
        }

        location /reviews {
            proxy_pass http://review_service;
        }

        location /coupons {
            proxy_pass http://order_service;
        }

        location /seckill/ {
            proxy_pass http://order_service;
        }
    }
}
