services:
  mysql-user:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?required}", MYSQL_DATABASE: user_db, MYSQL_USER: user_app, MYSQL_PASSWORD: "${USER_DB_PASSWORD:?required}" }
    volumes: [user_db_data:/var/lib/mysql]
    healthcheck: &mysql-health { test: [CMD, mysqladmin, ping, -h, localhost], interval: 10s, timeout: 5s, retries: 12 }
  mysql-shop:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?required}", MYSQL_DATABASE: shop_db, MYSQL_USER: shop_app, MYSQL_PASSWORD: "${SHOP_DB_PASSWORD:?required}" }
    volumes: [shop_db_data:/var/lib/mysql]
    healthcheck: *mysql-health
  mysql-review:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?required}", MYSQL_DATABASE: review_db, MYSQL_USER: review_app, MYSQL_PASSWORD: "${REVIEW_DB_PASSWORD:?required}" }
    volumes: [review_db_data:/var/lib/mysql]
    healthcheck: *mysql-health
  mysql-order:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?required}", MYSQL_DATABASE: order_db, MYSQL_USER: order_app, MYSQL_PASSWORD: "${ORDER_DB_PASSWORD:?required}" }
    volumes: [order_db_data:/var/lib/mysql]
    healthcheck: *mysql-health

  redis-shop:
    image: redis:7-alpine
    volumes: [shop_redis_data:/data]
    healthcheck: &redis-health { test: [CMD, redis-cli, ping], interval: 10s, timeout: 5s, retries: 10 }
  redis-order:
    image: redis:7-alpine
    volumes: [order_redis_data:/data]
    healthcheck: *redis-health

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment: { ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000 }
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck: { test: [CMD, kafka-broker-api-versions, --bootstrap-server, localhost:29092], interval: 15s, timeout: 10s, retries: 12, start_period: 30s }

  migrate-user: &migration
    build: { context: .., dockerfile: docker/Dockerfile.service, args: { SERVICE: migrate } }
    environment: { SERVICE_ROLE: user, DB_HOST: mysql-user, DB_NAME: user_db, DB_USER: user_app, DB_PASSWORD: "${USER_DB_PASSWORD:?required}", JWT_SECRET: "${JWT_SECRET:?required}" }
    depends_on: { mysql-user: { condition: service_healthy } }
  migrate-shop:
    <<: *migration
    environment: { SERVICE_ROLE: shop, DB_HOST: mysql-shop, DB_NAME: shop_db, DB_USER: shop_app, DB_PASSWORD: "${SHOP_DB_PASSWORD:?required}", REDIS_HOST: redis-shop, JWT_SECRET: "${JWT_SECRET:?required}" }
    depends_on: { mysql-shop: { condition: service_healthy } }
  migrate-review:
    <<: *migration
    environment: { SERVICE_ROLE: review, DB_HOST: mysql-review, DB_NAME: review_db, DB_USER: review_app, DB_PASSWORD: "${REVIEW_DB_PASSWORD:?required}", KAFKA_BROKERS: kafka:29092, JWT_SECRET: "${JWT_SECRET:?required}" }
    depends_on: { mysql-review: { condition: service_healthy }, kafka: { condition: service_healthy } }
  migrate-order:
    <<: *migration
    environment: { SERVICE_ROLE: order, DB_HOST: mysql-order, DB_NAME: order_db, DB_USER: order_app, DB_PASSWORD: "${ORDER_DB_PASSWORD:?required}", REDIS_HOST: redis-order, KAFKA_BROKERS: kafka:29092, JWT_SECRET: "${JWT_SECRET:?required}" }
    depends_on: { mysql-order: { condition: service_healthy }, kafka: { condition: service_healthy } }

  user-service:
    build: { context: .., dockerfile: services/user/Dockerfile }
    environment: { SERVICE_ROLE: user, PORT: 8080, DB_HOST: mysql-user, DB_NAME: user_db, DB_USER: user_app, DB_PASSWORD: "${USER_DB_PASSWORD:?required}", JWT_SECRET: "${JWT_SECRET:?required}" }
    depends_on: { migrate-user: { condition: service_completed_successfully } }
  shop-service:
    build: { context: .., dockerfile: services/shop/Dockerfile }
    environment: { SERVICE_ROLE: shop, PORT: 8080, DB_HOST: mysql-shop, DB_NAME: shop_db, DB_USER: shop_app, DB_PASSWORD: "${SHOP_DB_PASSWORD:?required}", REDIS_HOST: redis-shop, JWT_SECRET: "${JWT_SECRET:?required}" }
    depends_on: { migrate-shop: { condition: service_completed_successfully }, redis-shop: { condition: service_healthy } }
  review-service:
    build: { context: .., dockerfile: services/review/Dockerfile }
    environment: { SERVICE_ROLE: review, PORT: 8080, DB_HOST: mysql-review, DB_NAME: review_db, DB_USER: review_app, DB_PASSWORD: "${REVIEW_DB_PASSWORD:?required}", KAFKA_BROKERS: kafka:29092, JWT_SECRET: "${JWT_SECRET:?required}" }
    depends_on: { migrate-review: { condition: service_completed_successfully } }
  order-service:
    build: { context: .., dockerfile: services/order/Dockerfile }
    environment: { SERVICE_ROLE: order, PORT: 8080, DB_HOST: mysql-order, DB_NAME: order_db, DB_USER: order_app, DB_PASSWORD: "${ORDER_DB_PASSWORD:?required}", REDIS_HOST: redis-order, KAFKA_BROKERS: kafka:29092, JWT_SECRET: "${JWT_SECRET:?required}" }
    depends_on: { migrate-order: { condition: service_completed_successfully }, redis-order: { condition: service_healthy } }

  gateway:
    image: nginx:1.25-alpine
    ports: ["8081:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [user-service, shop-service, review-service, order-service]

volumes:
  user_db_data:
  shop_db_data:
  review_db_data:
  order_db_data:
  shop_redis_data:
  order_redis_data:
