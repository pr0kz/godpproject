services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-ai_review_system}
      MYSQL_USER: ${DB_USER:-ai_review_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 10s, timeout: 5s, retries: 10 }

  redis:
    image: redis:7.0-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment: { ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000 }
    healthcheck: { test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"], interval: 10s, timeout: 5s, retries: 10 }

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: { zookeeper: { condition: service_healthy } }
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck: { test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"], interval: 15s, timeout: 10s, retries: 10, start_period: 30s }

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile.service, args: { SERVICE: migrate } }
    environment: &common
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ai_review_system}
      DB_USER: ${DB_USER:-ai_review_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on: { mysql: { condition: service_healthy } }
    restart: "no"

  user-service:
    build: { context: .., dockerfile: docker/Dockerfile.service, args: { SERVICE: user-service } }
    environment: { <<: *common, SERVICE_ROLE: user }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    restart: unless-stopped

  shop-service:
    build: { context: .., dockerfile: docker/Dockerfile.service, args: { SERVICE: shop-service } }
    environment: { <<: *common, SERVICE_ROLE: shop }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    restart: unless-stopped

  review-service:
    build: { context: .., dockerfile: docker/Dockerfile.service, args: { SERVICE: review-service } }
    environment: { <<: *common, SERVICE_ROLE: review }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    restart: unless-stopped

  order-service:
    build: { context: .., dockerfile: docker/Dockerfile.service, args: { SERVICE: order-service } }
    environment: { <<: *common, SERVICE_ROLE: order }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy }, kafka: { condition: service_healthy } }
    restart: unless-stopped

  gateway:
    image: nginx:1.25-alpine
    ports: ["8081:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [user-service, shop-service, review-service, order-service]
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
